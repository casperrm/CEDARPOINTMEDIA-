name: Publish the translator

on:
  push:
    branches: [main]
    paths:
      - "translator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-translator
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the website
        run: |
          mkdir -p site/translator
          cp translator/*.html translator/*.css translator/*.js translator/README.md site/translator/
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Hamed Translator</title>
          <meta http-equiv="refresh" content="0; url=translator/">
          <link rel="canonical" href="translator/">
          <p>Opening <a href="translator/">Hamed Translator</a>…</p>
          HTML

      - name: Push it to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish translator from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
